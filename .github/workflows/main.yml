
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_API_LEVEL: 35
      BUILD_TOOLS_VERSION: 35.0.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -name "*.zip" -type f | head -1)
          echo "Found zip: $ZIP"
          mkdir -p /tmp/src
          unzip -o "$ZIP" -d /tmp/src
          find /tmp/src -name "settings.gradle" -type f
          find /tmp/src -name "colors.xml" -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK env
        run: |
          set -e
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$(dirname $SDKMANAGER)" >> $GITHUB_PATH

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          set -eu
          # sdkmanager is the last command in the pipeline; do not hide its failures.
          yes | sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Validate and repair missing color resources
        run: |
          set -euo pipefail
          PROJECT_DIR=$(dirname "$(find /tmp/src -name 'settings.gradle' -type f | head -1)")
          APP_DIR="$PROJECT_DIR/app"
          VALUES_DIR="$APP_DIR/src/main/res/values"
          mkdir -p "$VALUES_DIR"
          COLORS_FILE="$VALUES_DIR/colors.xml"
          # Preserve the project's existing palette. Add only absent resources;
          # never overwrite colors.xml with a partial list.
          python3 - "$COLORS_FILE" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8") if path.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          required = {
              "cream_background": "#F5EFE6",
              "gold_accent": "#D4A574",
              "cyan_accent": "#00D4FF",
              "dark_background": "#0A0A0A",
              "text_muted": "#A9A39B",
              "text_dark": "#000000",
              "text_light": "#FFFFFF",
          }
          existing = set(re.findall(r'<color\s+name=["\']([^"\']+)["\']', content))
          missing = [(name, value) for name, value in required.items() if name not in existing]
          if missing:
              if "</resources>" not in content:
                  raise SystemExit(f"Invalid resources XML in {path}: missing </resources>")
              additions = "".join(f'    <color name="{name}">{value}</color>\n' for name, value in missing)
              content = content.replace("</resources>", additions + "</resources>", 1)
              path.write_text(content, encoding="utf-8")
          # Verify every expected name exists after repair.
          final_names = set(re.findall(r'<color\s+name=["\']([^"\']+)["\']', content))
          still_missing = sorted(set(required) - final_names)
          if still_missing:
              raise SystemExit("Missing color resources after repair: " + ", ".join(still_missing))
          print(f"Validated {path}; added only missing colors: {[name for name, _ in missing]}")
          PY
          cat "$COLORS_FILE"

      - name: Build Debug APK
        run: |
          set -euo pipefail
          PROJECT_DIR=$(dirname "$(find /tmp/src -name 'settings.gradle' -type f | head -1)")
          test -n "$PROJECT_DIR" && test -f "$PROJECT_DIR/app/build.gradle"
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/build.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "=== Errors: ==="
          grep -i "error:" /tmp/build.log | head -30 || true
          exit "$EXIT_CODE"

      - name: Find APK
        if: always()
        run: find /tmp/src -name "*.apk" -type f

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: /tmp/src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
